name: Probe server HTTP routes
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check public HTTP and HTTPS
        run: |
          set +e
          curl --silent --show-error --connect-timeout 5 --max-time 15 --output /dev/null --write-out 'HTTP status: %{http_code}; remote: %{remote_ip}\n' http://netentra.citcoms.up.ac.th/
          echo "HTTP curl exit: $?"
          curl --insecure --silent --show-error --connect-timeout 5 --max-time 15 --output /dev/null --write-out 'HTTPS status: %{http_code}; remote: %{remote_ip}\n' https://netentra.citcoms.up.ac.th/
          echo "HTTPS curl exit: $?"
