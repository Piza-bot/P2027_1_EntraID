name: Probe server ports
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check public ports
        run: |
          set +e
          for port in 22 80 443 8443; do
            timeout 8 bash -c "cat < /dev/null > /dev/tcp/netentra.citcoms.up.ac.th/$port"
            echo "Port $port exit: $?"
          done
