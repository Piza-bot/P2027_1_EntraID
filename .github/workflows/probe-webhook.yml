name: Probe webhook HTTPS route
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Check authenticated TLS path
        run: |
          status=$(curl --silent --show-error --connect-timeout 10 --max-time 20 --cacert .github/p2027-webhook.crt --output /dev/null --write-out '%{http_code}' https://netentra.citcoms.up.ac.th/deploy)
          echo "Endpoint HTTP status: $status"
          test "$status" = 404
