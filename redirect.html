<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Signing in to Microsoft</title>
</head>
<body>
  <p>Completing sign-in...</p>
  <script type="module">
    import { PublicClientApplication } from "@azure/msal-browser";
    import { msalConfig } from "./src/authConfig.js";

    const msalInstance = new PublicClientApplication(msalConfig);
    try {
      await msalInstance.initialize();
      await msalInstance.handleRedirectPromise();
      window.location.replace(new URL(import.meta.env.BASE_URL, window.location.origin).href);
    } catch (error) {
      console.error("Authentication redirect failed:", error);
      document.body.textContent = "ลงชื่อเข้าใช้ไม่สำเร็จ กรุณากลับไปหน้าแอปและลองอีกครั้ง";
    }
  </script>
</body>
</html>
