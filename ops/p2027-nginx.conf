server {
    listen 80;
    server_name netentra.citcoms.up.ac.th;
    root /var/www/myapp/P2027_1_EntraID;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://netentra.citcoms.up.ac.th$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name netentra.citcoms.up.ac.th;

    ssl_certificate /home/piza/.local/state/p2027-site/fullchain.pem;
    ssl_certificate_key /home/piza/.local/state/p2027-site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/myapp/P2027_1_EntraID;
    index index.html;

    location = /deploy {
        client_max_body_size 2k;
        proxy_pass https://127.0.0.1:8443/deploy;
        proxy_ssl_verify off;
        proxy_read_timeout 240s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        return 404;
    }
}
